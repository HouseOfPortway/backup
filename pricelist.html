<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricelist — House Of Portway</title>
<link rel="stylesheet" href="https://use.typekit.net/dqp5aze.css">
<link rel="stylesheet" href="styles.css">
<style>
  .price-main{
    flex: 1;
    display: flex;
    align-items: center;
    padding: 70px 0 40px;
  }
  .price-inner{ width: 100%; }

  .price-title{
    text-align: center;
    font-size: clamp(42px, 6vw, 68px);
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0 0 14px;
  }
  .title-rule{
    width: 260px;
    height: 3px;
    background: var(--ink);
    margin: 0 auto 76px;
  }

  .price-body{
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 70px;
    max-width: 900px;
    margin: 0 auto;
    align-items: start;
  }

  .price-list{
    display: flex;
    flex-direction: column;
  }
  .price-row{
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 28px;
    padding: 5px 0;
  }
  .price-row .label{
    font-size: clamp(19px, 2.4vw, 28px);
    text-align: right;
  }
  .price-row .amount{
    font-weight: 600;
    font-size: clamp(19px, 2.4vw, 28px);
    min-width: 88px;
  }

  .price-note{
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.8;
    letter-spacing: 0.01em;
    max-width: 300px;
    padding-top: 10px;
    display: flex;
    gap: 10px;
  }
  .price-note .star{ flex: 0 0 auto; }

  @media (max-width: 760px){
    .price-body{ grid-template-columns: 1fr; gap: 34px; }
    .price-row{ justify-content: space-between; }
    .price-row .label{ text-align: left; }
    .price-note{ max-width: none; }
    .title-rule{ margin-bottom: 48px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="price-main">
      <div class="price-inner">
        <h1 class="price-title">PRICELIST</h1>
        <div class="title-rule"></div>

        <div class="price-body">
          <div class="price-list">
            <div class="price-row"><span class="label">Photography per hour</span><span class="amount">£60</span></div>
            <div class="price-row"><span class="label">Videography per hour</span><span class="amount">£60</span></div>
            <div class="price-row"><span class="label">Photo + Video per hour</span><span class="amount">£100</span></div>
            <div class="price-row"><span class="label">Design per hour</span><span class="amount">£35</span></div>
            <div class="price-row"><span class="label">Design per day</span><span class="amount">£210</span></div>
            <div class="price-row"><span class="label">Strategy per month</span><span class="amount">£350</span></div>
          </div>

          <div class="price-note">
            <span class="star">*</span>
            <span>Prices excluding VAT and such taxes. Minimum booking time of two hours required for production services</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <a class="brand" href="index.html"><img src="media/logo.png" alt="House of Portway"></a>
    </footer>
  </div>
</body>
</html>
